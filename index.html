<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📱 단어 제출하기</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #f4f7fc; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        h1 { font-size: 26px; color: #333; margin: 0 0 25px 0; text-align: center; font-weight: bold; }
        .input-area { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; box-sizing: border-box; }
        input[type="text"] { padding: 20px; font-size: 24px; border: 3px solid #4dadf7; border-radius: 15px; outline: none; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); -webkit-appearance: none; }
        button { background-color: #4dadf7; color: white; border: none; padding: 18px; font-size: 22px; font-weight: bold; border-radius: 15px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(77, 173, 247, 0.2); }
        button:active { background-color: #339af0; transform: scale(0.98); }
        .notice { margin-top: 20px; color: #888; font-size: 15px; text-align: center; }
    </style>
</head>
<body>

    <h1>💭 우리 반 구름에 단어 보내기</h1>

    <div class="input-area">
        <input type="text" id="word-input" placeholder="단어를 쓰고 [보내기] 클릭!" autofocus onkeyup="if(window.event.keyCode==13){sendWord()}">
        <button onclick="sendWord()">☁️ 구름으로 보내기</button>
    </div>
    <p class="notice">칠판(TV) 화면을 다 함께 보세요!</p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 새로 파신 프로젝트(wordcloud-56453)용 범용 연동 설정입니다!
        const firebaseConfig = {
            authDomain: "wordcloud-56453.firebaseapp.com",
            databaseURL: "https://wordcloud-56453-default-rtdb.firebaseio.com",
            projectId: "wordcloud-56453",
            storageBucket: "wordcloud-56453.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const colors = ['#ff4a4a', '#e600bc', '#673ab7', '#3f51b5', '#00bcd4', '#4caf50', '#ff9800', '#ff5722', '#109618'];

        window.sendWord = function() {
            const input = document.getElementById('word-input');
            const text = input.value.trim();

            if (text === "") return;
            if (text.length > 8) {
                alert("단어를 8자 이내로 짧게 적어주세요!");
                input.value = '';
                return;
            }

            const safeText = encodeURIComponent(text).replace(/\./g, '%2E');
            const wordRef = ref(database, 'words/' + safeText);
            
            get(wordRef).then((snapshot) => {
                if (snapshot.exists()) {
                    update(wordRef, { count: snapshot.val().count + 1 })
                    .then(() => { success(); })
                    .catch((err) => { alert("오류: " + err.message); });
                } else {
                    const randomColor = colors[Math.floor(Math.random() * colors.length)];
                    const x = Math.floor(Math.random() * (950 - 260)) + 130; 
                    const y = Math.floor(Math.random() * (600 - 260)) + 130; 

                    set(wordRef, {
                        text: text,
                        count: 1,
                        color: randomColor,
                        x: x,
                        y: y
                    })
                    .then(() => { success(); })
                    .catch((err) => { alert("오류: " + err.message); });
                }
            }).catch((err) => {
                alert("서버 연결 실패! 파이어베이스 [규칙] 탭에서 true로 게시했는지 꼭 확인해주세요!");
            });

            function success() {
                input.value = '';
                alert("성공적으로 보냈어요! 👍");
            }
        }
    </script>
</body>
</html>
