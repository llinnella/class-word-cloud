<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 단어 제출하기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7fc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; }
        h1 { font-size: 24px; color: #333; margin-bottom: 20px; text-align: center; }
        .input-area { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; }
        input[type="text"] { padding: 18px; font-size: 24px; border: 3px solid #4dadf7; border-radius: 15px; outline: none; text-align: center; }
        button { background-color: #4dadf7; color: white; border: none; padding: 15px; font-size: 22px; font-weight: bold; border-radius: 15px; cursor: pointer; transition: 0.2s; }
        button:active { background-color: #339af0; transform: scale(0.98); }
        .notice { margin-top: 15px; color: #888; font-size: 14px; text-align: center; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

    <h1>💭 우리 반 구름에 단어 보내기</h1>

    <div class="input-area">
        <input type="text" id="word-input" placeholder="단어를 쓰고 [보내기] 클릭!" autofocus onkeyup="if(window.event.keyCode==13){sendWord()}">
        <button onclick="sendWord()">☁️ 구름으로 보내기</button>
    </div>
    <p class="notice">칠판(TV) 화면을 다 함께 보세요!</p>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDBTjVpkPHRhbIUEbQ-55ihWWpISwYXGoc",
  authDomain: "class-wordcloud-fa480.firebaseapp.com",
  databaseURL: "https://class-wordcloud-fa480-default-rtdb.firebaseio.com",
  projectId: "class-wordcloud-fa480",
  storageBucket: "class-wordcloud-fa480.firebasestorage.app",
  messagingSenderId: "832736185461",
  appId: "1:832736185461:web:7a5c0a82d91bc1fd103c3c"
};

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const colors = ['#ff4a4a', '#e600bc', '#673ab7', '#3f51b5', '#00bcd4', '#4caf50', '#ff9800', '#ff5722', '#109618'];

    function sendWord() {
        const input = document.getElementById('word-input');
        const text = input.value.trim();

        if (text === "") return;
        if (text.length > 8) {
            alert("단어를 8자 이내로 짧게 적어주세요!");
            input.value = '';
            return;
        }

        const wordRef = database.ref('words/' + text);
        
        wordRef.once('value', (snapshot) => {
            if (snapshot.exists()) {
                // 이미 있는 단어면 카운트만 증가
                wordRef.update({ count: snapshot.val().count + 1 });
            } else {
                // 새 단어면 색상과 랜덤 위치(교실 대형화면 해상도 기준 마진 계산)를 최초 설정하여 저장
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                const x = Math.floor(Math.random() * (950 - 260)) + 130; 
                const y = Math.floor(Math.random() * (600 - 260)) + 130; 

                wordRef.set({
                    text: text,
                    count: 1,
                    color: randomColor,
                    x: x,
                    y: y
                });
            }
        });

        input.value = '';
        alert("성공적으로 보냈어요! 👍");
    }
</script>
</body>
</html>
